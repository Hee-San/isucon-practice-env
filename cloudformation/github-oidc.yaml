AWSTemplateFormatVersion: "2010-09-09"
Description: IAM role for GitHub Actions to create and delete ISUCON practice stacks (one-time setup)

Parameters:
  GitHubRepo:
    Type: String
    Default: Hee-San/isucon-practice-env
    Description: ワークフローを動かすリポジトリ(owner/name)
  GitHubOwnerId:
    Type: String
    Default: "8444945"
    Description: リポジトリ所有者の数値 ID(https://api.github.com/repos/<owner>/<name> の owner.id)
  GitHubRepoId:
    Type: String
    Default: "1404043632"
    Description: リポジトリの数値 ID(同じ API の id)
  CreateOIDCProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: アカウントに GitHub の OIDC プロバイダが既にあるなら false

Conditions:
  ShouldCreateOIDCProvider: !Equals [!Ref CreateOIDCProvider, "true"]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      # 名前を固定し、ワークフロー側はアカウント ID だけで ARN を組み立てる
      # (自動生成のランダムな接尾辞は、手で写すと l と I を取り違えやすい)
      RoleName: github-actions-isucon
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # main ブランチのワークフローだけが引き受けられる。
                # 新しいリポジトリの sub は所有者とリポジトリの数値 ID を含む
                # (repo:<owner>@<owner_id>/<name>@<repo_id>:ref:...)。名前を取り直されても一致しない。
                # 従来形式(repo:<owner>/<name>:ref:...)も並べておく(値のどれかに一致すればよい)
                token.actions.githubusercontent.com:sub:
                  - !Sub
                    - "repo:${Owner}@${GitHubOwnerId}/${Name}@${GitHubRepoId}:ref:refs/heads/main"
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                      Name: !Select [1, !Split ["/", !Ref GitHubRepo]]
                  - !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
      Policies:
        - PolicyName: isucon-practice
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # 練習用スタックは名前が isucon か private-isu で始まるものに限る
              - Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:ap-northeast-1:${AWS::AccountId}:stack/isucon*/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:ap-northeast-1:${AWS::AccountId}:stack/private-isu*/*"
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:ListStacks
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: "*"
              - Effect: Allow
                Action: ec2:*
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: ap-northeast-1

Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
