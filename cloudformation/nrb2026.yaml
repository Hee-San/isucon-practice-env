AWSTemplateFormatVersion: "2010-09-09"
Description: nrb2026 (ISUNARABE 2026) practice environment built on plain Ubuntu 24.04 (3 contestant servers + 1 benchmarker)

# nrb2026 は公開された AMI が無いので、素の Ubuntu 24.04 に起動時に組み立てる
# (nrb2026/provision.sh)。全台の準備が終わるまでスタックの作成を待つ。
# ネットワークの形は practice-env.yaml と同じ。アプリは本番と同じく 80 番で直接動く。
Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: Ubuntu 24.04 の AMI(ワークフローが最新を探して渡す)
  InstanceType:
    Type: String
    Default: c5.large
  BenchInstanceType:
    Type: String
    Default: c5.xlarge
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-northeast-1c
  GitHubUsers:
    Type: String
    Description: SSH 公開鍵を取り込む GitHub ユーザー名(スペース区切り)
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: 22/80 を開ける接続元

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 192.168.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 192.168.0.0/24
      AvailabilityZone: !Ref AvailabilityZone
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: nrb2026
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AllowedCidr }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedCidr }
  SecurityGroupSelfIngress:
    # VPC 内(競技サーバ同士・ベンチとの間)は全プロトコルを通す
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: "-1"
      SourceSecurityGroupId: !Ref SecurityGroup

  # 全台の準備(nrb2026/provision.sh)が終わるまでスタックの作成を待つ。失敗したらその理由が出る
  ProvisionHandle:
    Type: AWS::CloudFormation::WaitConditionHandle
  ProvisionWait:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: [Bench, Isu1, Isu2, Isu3]
    Properties:
      Handle: !Ref ProvisionHandle
      Count: 4
      Timeout: "2700"

  Bench:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref BenchInstanceType
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref Subnet
          GroupSet: [!Ref SecurityGroup]
          PrivateIpAddress: 192.168.0.10
          AssociatePublicIpAddress: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeType: gp3, VolumeSize: 30 }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-bench" }]
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            echo 'preserve_hostname: true' > /etc/cloud/cloud.cfg.d/99-isucon.cfg
            hostnamectl set-hostname ${Host}
            cat >> /etc/hosts <<'EOT'
            192.168.0.10 bench
            192.168.0.11 isu1
            192.168.0.12 isu2
            192.168.0.13 isu3
            EOT
            useradd -m -s /bin/bash isucon
            echo 'isucon ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/isucon
            chmod 440 /etc/sudoers.d/isucon
            install -d -m 700 -o isucon -g isucon /home/isucon/.ssh
            for u in ${GitHubUsers}; do
              curl -fsS "https://github.com/$u.keys" >> /home/isucon/.ssh/authorized_keys
            done
            chown isucon:isucon /home/isucon/.ssh/authorized_keys
            chmod 600 /home/isucon/.ssh/authorized_keys
            # 組み立てる。スクリプト自体を取れなかったときも失敗を知らせる
            curl -fsSL --retry 5 -o /root/provision.sh \
              https://raw.githubusercontent.com/Hee-San/isucon-practice-env/main/nrb2026/provision.sh &&
              bash /root/provision.sh ${Host} "${Signal}" ||
              curl -fsS -X PUT -H 'Content-Type:' \
                --data-binary '{"Status":"FAILURE","Reason":"${Host}: provision failed","UniqueId":"${Host}","Data":"FAILURE"}' \
                "${Signal}"
          - Host: bench
            Signal: !Ref ProvisionHandle
  BenchEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Bench

  Isu1:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref Subnet
          GroupSet: [!Ref SecurityGroup]
          PrivateIpAddress: 192.168.0.11
          AssociatePublicIpAddress: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeType: gp3, VolumeSize: 30 }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-isu1" }]
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            echo 'preserve_hostname: true' > /etc/cloud/cloud.cfg.d/99-isucon.cfg
            hostnamectl set-hostname ${Host}
            cat >> /etc/hosts <<'EOT'
            192.168.0.10 bench
            192.168.0.11 isu1
            192.168.0.12 isu2
            192.168.0.13 isu3
            EOT
            useradd -m -s /bin/bash isucon
            echo 'isucon ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/isucon
            chmod 440 /etc/sudoers.d/isucon
            install -d -m 700 -o isucon -g isucon /home/isucon/.ssh
            for u in ${GitHubUsers}; do
              curl -fsS "https://github.com/$u.keys" >> /home/isucon/.ssh/authorized_keys
            done
            chown isucon:isucon /home/isucon/.ssh/authorized_keys
            chmod 600 /home/isucon/.ssh/authorized_keys
            # 組み立てる。スクリプト自体を取れなかったときも失敗を知らせる
            curl -fsSL --retry 5 -o /root/provision.sh \
              https://raw.githubusercontent.com/Hee-San/isucon-practice-env/main/nrb2026/provision.sh &&
              bash /root/provision.sh ${Host} "${Signal}" ||
              curl -fsS -X PUT -H 'Content-Type:' \
                --data-binary '{"Status":"FAILURE","Reason":"${Host}: provision failed","UniqueId":"${Host}","Data":"FAILURE"}' \
                "${Signal}"
          - Host: isu1
            Signal: !Ref ProvisionHandle
  Isu1EIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Isu1

  Isu2:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref Subnet
          GroupSet: [!Ref SecurityGroup]
          PrivateIpAddress: 192.168.0.12
          AssociatePublicIpAddress: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeType: gp3, VolumeSize: 30 }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-isu2" }]
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            echo 'preserve_hostname: true' > /etc/cloud/cloud.cfg.d/99-isucon.cfg
            hostnamectl set-hostname ${Host}
            cat >> /etc/hosts <<'EOT'
            192.168.0.10 bench
            192.168.0.11 isu1
            192.168.0.12 isu2
            192.168.0.13 isu3
            EOT
            useradd -m -s /bin/bash isucon
            echo 'isucon ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/isucon
            chmod 440 /etc/sudoers.d/isucon
            install -d -m 700 -o isucon -g isucon /home/isucon/.ssh
            for u in ${GitHubUsers}; do
              curl -fsS "https://github.com/$u.keys" >> /home/isucon/.ssh/authorized_keys
            done
            chown isucon:isucon /home/isucon/.ssh/authorized_keys
            chmod 600 /home/isucon/.ssh/authorized_keys
            # 組み立てる。スクリプト自体を取れなかったときも失敗を知らせる
            curl -fsSL --retry 5 -o /root/provision.sh \
              https://raw.githubusercontent.com/Hee-San/isucon-practice-env/main/nrb2026/provision.sh &&
              bash /root/provision.sh ${Host} "${Signal}" ||
              curl -fsS -X PUT -H 'Content-Type:' \
                --data-binary '{"Status":"FAILURE","Reason":"${Host}: provision failed","UniqueId":"${Host}","Data":"FAILURE"}' \
                "${Signal}"
          - Host: isu2
            Signal: !Ref ProvisionHandle
  Isu2EIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Isu2

  Isu3:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref Subnet
          GroupSet: [!Ref SecurityGroup]
          PrivateIpAddress: 192.168.0.13
          AssociatePublicIpAddress: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeType: gp3, VolumeSize: 30 }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-isu3" }]
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            echo 'preserve_hostname: true' > /etc/cloud/cloud.cfg.d/99-isucon.cfg
            hostnamectl set-hostname ${Host}
            cat >> /etc/hosts <<'EOT'
            192.168.0.10 bench
            192.168.0.11 isu1
            192.168.0.12 isu2
            192.168.0.13 isu3
            EOT
            useradd -m -s /bin/bash isucon
            echo 'isucon ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/isucon
            chmod 440 /etc/sudoers.d/isucon
            install -d -m 700 -o isucon -g isucon /home/isucon/.ssh
            for u in ${GitHubUsers}; do
              curl -fsS "https://github.com/$u.keys" >> /home/isucon/.ssh/authorized_keys
            done
            chown isucon:isucon /home/isucon/.ssh/authorized_keys
            chmod 600 /home/isucon/.ssh/authorized_keys
            # 組み立てる。スクリプト自体を取れなかったときも失敗を知らせる
            curl -fsSL --retry 5 -o /root/provision.sh \
              https://raw.githubusercontent.com/Hee-San/isucon-practice-env/main/nrb2026/provision.sh &&
              bash /root/provision.sh ${Host} "${Signal}" ||
              curl -fsS -X PUT -H 'Content-Type:' \
                --data-binary '{"Status":"FAILURE","Reason":"${Host}: provision failed","UniqueId":"${Host}","Data":"FAILURE"}' \
                "${Signal}"
          - Host: isu3
            Signal: !Ref ProvisionHandle
  Isu3EIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Isu3

Outputs:
  bench:
    Value: !Ref BenchEIP
  isu1:
    Value: !Ref Isu1EIP
  isu2:
    Value: !Ref Isu2EIP
  isu3:
    Value: !Ref Isu3EIP
  InstanceIds:
    Value: !Sub "${Bench} ${Isu1} ${Isu2} ${Isu3}"
