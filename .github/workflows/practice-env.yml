name: practice-env

# ISUCON 過去問の練習環境(cloudformation/practice-env.yaml)を作成・削除する。
# 止めている間の課金をゼロにするため、「止める」はインスタンス停止ではなくスタック削除にする。
#
# 公開リポジトリなので、ログと Summary に次のものを出さない:
#   - サーバの IP: ssh_config はメンバーの SSH 公開鍵で暗号化してから Summary に出す
#   - AWS のアカウント ID: Secret に置き、ログではマスクする
#   - メンバーの GitHub ユーザー名: Secret に置く
on:
  workflow_dispatch:
    inputs:
      action:
        description: "up = 作成 / down = 削除 / status = バッジだけ更新"
        type: choice
        options: [up, down, status]
      problem:
        description: "練習する回(スタック名になる)"
        type: choice
        options: [isucon14, isucon13, isucon12-qualify, isucon11-qualify, private-isu]
      name:
        description: "同じ回を複数建てるときの区別(英小文字と数字で10文字まで。例: 2, b)。空なら1つ目。公開ログに出るので GitHub ユーザー名は避ける"
        type: string
        default: ""
  schedule:
    # 消し忘れの安全網: 毎日 05:00 JST に残っている練習環境をすべて削除する
    - cron: "0 20 * * *"

permissions:
  contents: write # 状態バッジを isucon-status ブランチへ push するため
  id-token: write # AWS へ OIDC で入るため

# 同じスタックの作成と削除が同時に走らないよう、スタックごとに直列化する。
# 別のスタック(回や name が違うもの)は並行して作れる
concurrency:
  group: practice-env-${{ inputs.problem }}-${{ inputs.name }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  TEMPLATE: cloudformation/practice-env.yaml
  STACK_TAG: managed-by=isucon-practice

jobs:
  up:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'up'
    name: 作成
    # aws CLI が入っている標準ランナーを使う。スタック作成の待ちを含めて5分前後
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # name を付けると、スタック名は <回>-<name>(例: isucon14-2)
      STACK: ${{ inputs.problem }}${{ inputs.name != '' && '-' || '' }}${{ inputs.name }}
      NAME: ${{ inputs.name }}
      PROBLEM: ${{ inputs.problem }}
      GITHUB_USERS: ${{ secrets.ISUCON_GITHUB_USERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: name の形を確かめる
        run: |
          if ! [[ "$NAME" =~ ^[a-z0-9]{0,10}$ ]]; then
            echo "::error::name は英小文字と数字で10文字までにしてください"; exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-isucon
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: ロールを引き受けられなかったときに OIDC トークンの中身を出す
        if: ${{ failure() }}
        run: |
          # トークン自体は出さず、AWS 側の信頼条件と突き合わせる項目だけを表示する
          curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" |
            python3 -c 'import sys, json, base64
          t = json.load(sys.stdin)["value"].split(".")[1]
          c = json.loads(base64.urlsafe_b64decode(t + "=" * (-len(t) % 4)))
          for k in ("sub", "aud", "ref", "repository"):
              print(f"{k}: {c.get(k)}")'
          echo "AWS 側の信頼条件の sub は repo:<owner>@<owner_id>/<repo>@<repo_id>:ref:refs/heads/main(または従来形式)。違っていればここが原因"
          echo "一致しているなら、Secret AWS_ACCOUNT_ID の値(12桁の数字)を確かめる"

      - name: 回ごとのパラメータを決める
        id: params
        run: |
          # ISUCON の AMI ID は matsuu/aws-isucon、private-isu は catatsuy/private-isu の README から。
          # 差し替えられたらここを直す
          count=3; http=false; type=c5.large; bench=c5.xlarge
          case "$PROBLEM" in
            isucon14)         ami=ami-0fcf9e8e8675a9ee4; vol=20 ;;
            isucon13)         ami=ami-006d211cb716fe8a0; vol=40 ;;
            isucon12-qualify) ami=ami-073140ad092048333; vol=20 ;;
            isucon11-qualify) ami=ami-0796be4f4814fc3d5; vol=20 ;;
            # 1台構成の問題。インスタンスタイプは公式の推奨値、アプリは 80 番
            private-isu)      ami=ami-09201e964bee13733; vol=30
                              count=1; http=true; type=c7a.large; bench=c7a.xlarge ;;
            *) echo "::error::未知の回: $PROBLEM"; exit 1 ;;
          esac
          if [ -z "$GITHUB_USERS" ]; then
            echo "::error::Secret ISUCON_GITHUB_USERS が空です"; exit 1
          fi
          {
            echo "ami=$ami"
            echo "vol=$vol"
            echo "count=$count"
            echo "http=$http"
            echo "type=$type"
            echo "bench=$bench"
          } >> "$GITHUB_OUTPUT"

      - name: 作成に失敗したスタックが残っていれば消す
        run: |
          status=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)
          if [ "$status" = "ROLLBACK_COMPLETE" ]; then
            aws cloudformation delete-stack --stack-name "$STACK"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK"
          fi

      - name: スタックを作る
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK" \
            --template-file "$TEMPLATE" \
            --tags "$STACK_TAG" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ImageId=${{ steps.params.outputs.ami }} \
              VolumeSize=${{ steps.params.outputs.vol }} \
              ContestantCount=${{ steps.params.outputs.count }} \
              OpenHttp=${{ steps.params.outputs.http }} \
              InstanceType=${{ steps.params.outputs.type }} \
              BenchInstanceType=${{ steps.params.outputs.bench }} \
              GitHubUsers="$GITHUB_USERS"

      - name: ssh_config を暗号化して Summary に出す
        run: |
          sudo apt-get install -y -qq age > /dev/null

          # 宛先はメンバーの GitHub 公開鍵。age が扱えるのは ed25519 と RSA だけ
          : > recipients.txt
          for u in $GITHUB_USERS; do
            keys=$(curl -fsS "https://github.com/$u.keys" | grep -E '^(ssh-ed25519|ssh-rsa) ' || true)
            if [ -z "$keys" ]; then
              echo "::warning::GitHub ユーザーの1人に ed25519 / RSA の公開鍵がありません。その人は ssh_config を復号できません"
            fi
            printf '%s\n' "$keys" >> recipients.txt
          done
          sed -i '/^$/d' recipients.txt

          # 2つ目以降の環境は、手元の ~/.ssh/config で1つ目とぶつからないよう
          # Host を isu1-<name> の形にする(サーバの中の名前は isu1 のまま)
          suffix=${NAME:+-$NAME}
          # 手元で前回の分を消せるよう、目印で囲む。目印は回ではなく Host 名の組
          # (name)ごとにし、別の回を作ったときも同じ isu1 などを置き換える。
          # 作り直すたびに IP とホスト鍵が変わるので、known_hosts には記録しない。
          # 手元では ~/.ssh/config の先頭に置く(ssh は先に書かれた値を使うので、
          # 後ろにある Host * や目印の無い古い Host isu1 に負けない)。最後の Host * は、
          # 元の先頭にあった Host 指定の無い行を、今までどおり全ホストに効かせるため
          mark="isucon-practice$suffix"
          config="# >>> $mark >>> $STACK"$'\n'
          hosts=""
          for h in isu1 isu2 isu3 bench; do
            ip=$(aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$h'].OutputValue" --output text)
            [ -z "$ip" ] && continue # 1台構成では isu2 / isu3 が無い
            echo "::add-mask::$ip"
            config+="Host $h$suffix
            HostName $ip
            User isucon
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          "
            hosts+="${hosts:+ }$h$suffix"
          done
          config+="Host *"$'\n'"# <<< $mark <<<"$'\n'
          printf '%s' "$config" | age --armor -R recipients.txt > ssh_config.age

          readme="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/README.md"
          first=${hosts%% *}

          {
            echo "## $STACK を作成しました"
            echo
            echo "### 1. 手元の ~/.ssh/config に接続先を入れる"
            echo
            echo '下のブロックを**丸ごと1回で**コピーして、手元のターミナルに貼り付けます。'
            echo "暗号文を GitHub に登録した SSH 秘密鍵で復号し、前に足した \`$hosts\` の設定(回は問わない)を消してから、新しい設定を先頭に足します。"
            echo '1行目の `K=` は、GitHub に登録した秘密鍵です。`~/.ssh/id_ed25519` でなければ、貼る前に自分の鍵に書き換えてください。'
            echo
            echo '```bash'
            # macOS 標準の zsh は対話シェルで # をコメントとして扱わないので、貼るブロックにコメントを書かない
            echo 'K=~/.ssh/id_ed25519'
            echo "cfg=\$(age -d -i \"\$K\" <<'EOF'"
            cat ssh_config.age
            echo 'EOF'
            echo ') && touch ~/.ssh/config && \'
            # perl -i はシンボリックリンクを普通のファイルに置き換えるので、
            # 中身を変数に読んでから > で書き戻す(リンク先と権限がそのまま残る)
            echo "old=\$(perl -0pe 's/^# >>> $mark >>>.*?^# <<< $mark <<<\\n//msg' ~/.ssh/config) && \\"
            echo '{ printf '"'"'%s\n'"'"' "$cfg" | awk -v k="$K" '"'"'{print} /^  User isucon$/{print "  IdentityFile " k; print "  IdentitiesOnly yes"}'"'"'; if [ -n "$old" ]; then printf '"'"'%s\n'"'"' "$old"; fi; } > ~/.ssh/config && \'
            echo "echo 追加しました: $hosts"
            echo '```'
            echo
            echo '`age: error: no identity matched` と出たら、その鍵は GitHub に登録されていません(README の「メンバーの事前準備」を見てください)。'
            echo
            echo "### 2. サーバに入る"
            echo
            echo '1行目で全台に入れるか確かめてから、入ります。'
            echo
            echo '```bash'
            echo "for h in $hosts; do ssh \$h hostname; done"
            echo "ssh $first"
            echo '```'
            echo
            echo "最初にやること(運営用ユーザーの削除、bench 機のアプリ停止)は [README の「起動後の初期作業」]($readme#起動後の初期作業) にあります。"
            echo
            echo "### 3. ポータルの代わり"
            echo
            echo '当日マニュアルでポータルを使うところは、この環境では次のようにします。'
            echo
            echo '| 本番のポータル | この環境 |'
            echo '|---|---|'
            echo "| サーバーリスト(IP アドレス) | 手元で \`ssh -G $first \\| awk '/^hostname /{print \$2}'\`(この Summary には IP を出していません) |"
            echo '| 負荷走行の実行(Job Enqueue Form)と結果 | bench 機でベンチを実行し、その出力を見る(下の「ベンチを回す」) |'
            echo '| 質問・アナウンス・リーダーボード | ありません。スコアはチームで記録してください |'
            echo '| 環境チェック(envcheck) | ありません(結果をポータルに送るためのもの) |'
            echo
            # 回ごとの資料・Web ページ・ベンチは docs/problems/<回>.md に書いてあり、
            # 見出しの番号はここで振る(4 から)
            scripts/render-problem.sh "docs/problems/$PROBLEM.md" 4 "$NAME"
            last=$((3 + $(grep -c '^## ' "docs/problems/$PROBLEM.md")))
            echo
            echo "### $((last + 1)). 終わったら消す"
            echo
            echo "サーバ上の変更は消えるので、先にチームのリポジトリへ push してから、Actions の「practice-env」を \`down\`(problem と name は作ったときと同じ)で実行してください。"
            echo '消し忘れても毎日 05:00 JST に自動で削除されます。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 状態バッジを更新する
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/update-badge.sh

  down:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'down'
    name: 削除
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # name を付けると、スタック名は <回>-<name>(例: isucon14-2)
      STACK: ${{ inputs.problem }}${{ inputs.name != '' && '-' || '' }}${{ inputs.name }}
      NAME: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: name の形を確かめる
        run: |
          if ! [[ "$NAME" =~ ^[a-z0-9]{0,10}$ ]]; then
            echo "::error::name は英小文字と数字で10文字までにしてください"; exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-isucon
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: ロールを引き受けられなかったときに OIDC トークンの中身を出す
        if: ${{ failure() }}
        run: |
          # トークン自体は出さず、AWS 側の信頼条件と突き合わせる項目だけを表示する
          curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" |
            python3 -c 'import sys, json, base64
          t = json.load(sys.stdin)["value"].split(".")[1]
          c = json.loads(base64.urlsafe_b64decode(t + "=" * (-len(t) % 4)))
          for k in ("sub", "aud", "ref", "repository"):
              print(f"{k}: {c.get(k)}")'
          echo "AWS 側の信頼条件の sub は repo:<owner>@<owner_id>/<repo>@<repo_id>:ref:refs/heads/main(または従来形式)。違っていればここが原因"
          echo "一致しているなら、Secret AWS_ACCOUNT_ID の値(12桁の数字)を確かめる"

      - name: スタックを削除する
        run: |
          # 無いスタックを消しても成功になるので、name の打ち間違いで本物が残らないよう先に確かめる
          if ! aws cloudformation describe-stacks --stack-name "$STACK" > /dev/null 2>&1; then
            stacks=$(aws cloudformation describe-stacks \
              --query "Stacks[?Tags[?Key=='managed-by' && Value=='isucon-practice']].StackName" \
              --output text)
            stacks=$(echo $stacks) # タブ区切りを空白区切りにする
            echo "::error::$STACK はありません。いまある練習環境: ${stacks:-なし}(problem と name を確かめてください)"
            exit 1
          fi
          aws cloudformation delete-stack --stack-name "$STACK"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK"
          echo "## $STACK を削除しました" >> "$GITHUB_STEP_SUMMARY"

      - name: 状態バッジを更新する
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/update-badge.sh

  cleanup:
    if: github.event_name == 'schedule'
    name: 消し忘れの削除
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-isucon
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: ロールを引き受けられなかったときに OIDC トークンの中身を出す
        if: ${{ failure() }}
        run: |
          # トークン自体は出さず、AWS 側の信頼条件と突き合わせる項目だけを表示する
          curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" |
            python3 -c 'import sys, json, base64
          t = json.load(sys.stdin)["value"].split(".")[1]
          c = json.loads(base64.urlsafe_b64decode(t + "=" * (-len(t) % 4)))
          for k in ("sub", "aud", "ref", "repository"):
              print(f"{k}: {c.get(k)}")'
          echo "AWS 側の信頼条件の sub は repo:<owner>@<owner_id>/<repo>@<repo_id>:ref:refs/heads/main(または従来形式)。違っていればここが原因"
          echo "一致しているなら、Secret AWS_ACCOUNT_ID の値(12桁の数字)を確かめる"

      - name: タグ付きの練習用スタックをすべて削除する
        run: |
          stacks=$(aws cloudformation describe-stacks \
            --query "Stacks[?Tags[?Key=='managed-by' && Value=='isucon-practice']].StackName" \
            --output text)
          if [ -z "$stacks" ]; then
            echo "残っている練習環境はありません"
          fi
          for s in $stacks; do
            echo "削除: $s"
            aws cloudformation delete-stack --stack-name "$s"
          done
          for s in $stacks; do
            aws cloudformation wait stack-delete-complete --stack-name "$s"
          done
          if [ -n "$stacks" ]; then
            echo "## 消し忘れを削除しました: $stacks" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 状態バッジを更新する
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/update-badge.sh

  status:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'status'
    name: バッジ更新
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-isucon
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: ロールを引き受けられなかったときに OIDC トークンの中身を出す
        if: ${{ failure() }}
        run: |
          # トークン自体は出さず、AWS 側の信頼条件と突き合わせる項目だけを表示する
          curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" |
            python3 -c 'import sys, json, base64
          t = json.load(sys.stdin)["value"].split(".")[1]
          c = json.loads(base64.urlsafe_b64decode(t + "=" * (-len(t) % 4)))
          for k in ("sub", "aud", "ref", "repository"):
              print(f"{k}: {c.get(k)}")'
          echo "AWS 側の信頼条件の sub は repo:<owner>@<owner_id>/<repo>@<repo_id>:ref:refs/heads/main(または従来形式)。違っていればここが原因"
          echo "一致しているなら、Secret AWS_ACCOUNT_ID の値(12桁の数字)を確かめる"

      - name: 状態バッジを更新する
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/update-badge.sh
